[project]
name = "cuttlefish"
version = "0.1.0"
description = "Terminal animations rendered with truecolor ANSI characters."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
]

[project.scripts]
cuttlefish = "cuttlefish.cli:main_entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuttlefish*"]
